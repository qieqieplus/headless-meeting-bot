<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HLS Player</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/video.js@8/dist/video-js.min.css"
    />
    <style>
      :root {
        --bg: #111;
        --fg: #eee;
        --muted: #aaa;
        --surface: #222;
        --border: #333;
        --accent: #007acc;
        --accent-hover: #005aa3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: sans-serif;
        background: var(--bg);
        color: var(--fg);
      }

      header {
        padding: 2rem 1rem 1rem;
        text-align: center;
      }

      main {
        width: min(90vw, 800px);
      }

      .video-container {
        overflow: hidden;
        border-radius: 0.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .path-input {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 1rem;
        gap: 0.5rem;
      }

      .path-input select,
      .path-input button {
        border-radius: 0.25rem;
      }

      .path-input select {
        flex: 1;
        min-width: 300px;
        padding: 0.5rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        font-family: monospace;
        font-size: 0.875rem;
      }

      .path-input button {
        padding: 0.5rem 1rem;
        border: none;
        background: var(--accent);
        color: var(--fg);
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .path-input button:hover,
      .path-input button:focus-visible {
        background: var(--accent-hover);
      }

      footer {
        margin-top: auto;
        padding: 2rem 0 1.5rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h2>HTTP Live Stream Player</h2>
      <div class="path-input">
        <select id="hls-path">
          <option value="">Loading available streams...</option>
        </select>
        <button onclick="loadLocalStream()">Load Stream</button>
      </div>
    </header>
    <main>
      <div class="video-container">
        <video
          id="demo-player"
          class="video-js vjs-default-skin"
          controls
          preload="auto"
          width="800"
          height="450"
          data-setup="{}"
        >
          <p class="vjs-no-js">
            To view this video please enable JavaScript, and consider upgrading to a
            web browser that supports HTML5 video.
          </p>
        </video>
      </div>
    </main>
    <footer>
      Powered by Video.js
    </footer>

    <script src="https://unpkg.com/video.js@8/dist/video.min.js"></script>
    <script>
      let player;

      // Load available m3u8 files and populate dropdown
      async function loadM3U8Files() {
        try {
          const response = await fetch('m3u8.json');
          const files = await response.json();
          const select = document.getElementById('hls-path');

          // Clear existing options
          select.innerHTML = '';

          if (files.length === 0) {
            select.innerHTML = '<option value="">No m3u8 files found</option>';
            return;
          }

          // Add default option
          const defaultOption = document.createElement('option');
          defaultOption.value = '';
          defaultOption.textContent = 'Select a stream...';
          select.appendChild(defaultOption);

          // Add file options
          files.forEach(path => {
            const option = document.createElement('option');
            option.value = path;
            option.textContent = path.split('/').pop();
            select.appendChild(option);
          });

          // Auto-select first file if available
          if (files.length > 0) {
            select.value = files[0];
          }
        } catch (error) {
          console.error('Error loading m3u8 files:', error);
          const select = document.getElementById('hls-path');
          select.innerHTML = '<option value="">Error loading files</option>';
        }
      }

      // Initialize player when Video.js is ready
      videojs('demo-player').ready(function() {
        player = this;
        // Load available streams first, then auto-play first one
        loadM3U8Files().then(() => {
          loadLocalStream();
        });
      });

      function loadLocalStream() {
        const pathSelect = document.getElementById('hls-path');
        const path = pathSelect.value.trim();

        if (!path) {
          alert('Please select a valid HLS stream');
          return;
        }

        if (player) {
          player.src({
            src: path,
            type: 'application/x-mpegURL'
          });
          player.load();
          player.play();
        }
      }

      // Auto-load stream when selection changes
      document.getElementById('hls-path').addEventListener('change', function() {
        if (this.value) {
          loadLocalStream();
        }
      });
    </script>
  </body>
</html>
